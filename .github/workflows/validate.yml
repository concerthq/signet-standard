name: Validate SIGNET standard

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install validation tooling
        run: npm install ajv@8 ajv-formats@3 ajv-cli@5 --no-save

      - name: Validate examples against schemas
        run: node validate.js

      - name: Lint codelists (CSV header check)
        run: |
          for f in codelists/*.csv; do
            head -1 "$f" | grep -q '^Code,Title,Description' || { echo "Bad header in $f"; exit 1; }
          done
          echo "All codelists have a valid header."

      - name: Codelist governance (open/core split, headers, append-only)
        run: node conformance/rules/check-codelists.js

      - name: Mark grammar linter (canonical strings, registers, ABNF)
        run: node tools/lint-mark-strings.js

      - name: Check JSON well-formedness
        run: |
          for f in schema/*.json examples/*.json schema/context.jsonld; do
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" || { echo "Invalid JSON: $f"; exit 1; }
          done
          echo "All JSON files well-formed."

      - name: Project invoice to Peppol BIS Billing UBL and verify
        run: |
          node tools/signet-to-ubl.js > /tmp/invoice.ubl.xml
          python3 tools/verify-ubl.py /tmp/invoice.ubl.xml examples/invoice.json

      - name: Conformance harness — reference implementation must reach Core+
        run: node conformance/runner/run-conformance.js

      - name: Conformance harness — broken implementation must be rejected
        run: |
          if node conformance/runner/run-conformance.js --adapter conformance/adapter/broken-adapter.js; then
            echo "ERROR: broken adapter was not rejected"; exit 1
          else
            echo "OK: harness correctly failed the broken adapter"
          fi

      # Endorsement checks are DRAFT and decide no conformance level. They run in CI so the
      # gap they close stays demonstrable: the broken adapter passes F-SEM above and fails
      # E-MDT-1 here, which is the whole argument for the endorsement in one diff.
      - name: Endorsement checks — reference implementation must earn E-MDT and E-CNS
        run: node conformance/rules/check-endorsements.js

      - name: Endorsement checks — the cites-but-does-not-enforce adapter must fail E-MDT
        run: |
          if node conformance/rules/check-endorsements.js --adapter conformance/adapter/broken-adapter.js; then
            echo "ERROR: an adapter that cites its mandate without enforcing it earned E-MDT"; exit 1
          else
            echo "OK: E-MDT correctly refused the cites-but-does-not-enforce adapter"
          fi

      - name: Agent demonstration — governed action must be conformance-clean
        run: node agent/run-agent.js

      - name: Supplier-qualification demo — conditional outcome, conformance-clean
        run: node onboarding/run-onboarding.js

      - name: Reverse-auction demo — deterministic, conformance-clean close
        run: node auction/run-auction.js

      - name: Commodity-risk conformance rules (reconciliation, scenario integrity, ordering)
        run: node conformance/rules/check-commodity-risk.js

      - name: Extension conformance rules (onboarding, auction, identity)
        run: npm run conformance:extensions

      - name: State model — registry integrity, surface authority, and the basis rule
        run: node conformance/rules/check-state-model.js .

      # A path is declared as published or consumed, or a claim that it has no consumer is not
      # testable from inside this repository. That was the IAR-0003 defect: submissionStatus.csv
      # was deleted on a "no consumer" claim and returned 404 on a published $id URL.
      - name: Public interface — every declared path exists
        run: node conformance/rules/check-public-interface.js .

      # Draft-07 vs 2020-12 verdict equivalence across the corpus. Report-only until the v1.0
      # train decides the migration; --gate after. Precedent: "checks implemented, non-gating"
      # (CP-Mandate-enforcement). A reported difference is evidence for that decision, not a
      # failure of this one.
      - name: Dialect equivalence — Draft-07 and 2020-12 must agree (report only)
        run: npm run conformance:dialect

      # Closed codelists must be enforced in schema, not merely cited in a description.
      #
      # This step FAILS on main today, and that is the accurate state: the binding manifest and
      # this checker landed at v0.16.0, the generated enums did not, and four bound properties are
      # still "type": "string" so any string validates. Generating the enums alters schema/ and is
      # a Tier 2 act under governance/IAR-0003, which has not landed. (D-14, D-30)
      #
      # No continue-on-error. A check that exists and does not run is how a rule stays unenforced
      # while appearing enforced — the failure is the point.
      - name: Closed codelist bindings — enforced in schema, not merely cited
        run: node conformance/rules/check-codelist-binding.js .

  # Concert names no individual and no commercial implementer. The deny-list is stored as
  # salted digests, never as terms, so CI needs the salt to compute them. The secret name is
  # referenced here; the value is held in repository secrets and never in the repository.
  naming:
    runs-on: ubuntu-latest
    env:
      SIGNET_NAMING_SALT: ${{ secrets.SIGNET_NAMING_SALT }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Naming check — no named individuals, no commercial implementers
        run: node conformance/rules/check-naming.js .
