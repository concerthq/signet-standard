name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

# Least privilege; pull_request_target runs with the base repo's token + secrets.
permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  CLAAssistant:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: a repo-scoped PAT, only needed if signatures are stored in a
          # remote repo. Empty here -> the action uses GITHUB_TOKEN against the
          # (unprotected) cla-signatures branch in this repo.
          PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        with:
          # Where signatures are recorded (kept off main, which is protected).
          path-to-signatures: 'signatures/version1/cla.json'
          branch: 'cla-signatures'
          # The CLA contributors agree to.
          path-to-document: 'https://github.com/concerthq/signet-standard/blob/main/CLA.md'
          # The sign / recheck phrases shown to contributors.
          custom-notsigned-prcomment: 'Thank you for your contribution to **SIGNET**. Before it can be merged, please read our [Contributor Licence Agreement](https://github.com/concerthq/signet-standard/blob/main/CLA.md) and confirm your agreement by posting the comment below.'
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-allsigned-prcomment: 'All contributors have signed the CLA. ✅'
          # Bots and the steward account never need to sign.
          allowlist: 'concertfoundation,dependabot[bot],github-actions[bot],*[bot]'
